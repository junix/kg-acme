<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img">
<title>错误处理：九个机器码与单信封纪律</title>
<desc>机器错误码全景、输出纪律与实测失败契约</desc>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1120" height="640" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="0.5" y="0.5" width="1119" height="639" rx="10" fill="none" stroke="#D8E2EC" stroke-width="1"/>
<text x="40" y="44" font-size="15" fill="#1D5FBF" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">错误处理</text>
<text x="40" y="80" font-size="22" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">错误码集合固定，输出纪律只有一条</text>
<rect x="40" y="108" width="560" height="250" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="41.5" y="108.5" width="557" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="56" y="140" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">九个机器错误码（协议层固定集合）</text>
<rect x="64" y="156" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="74" y="175" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">版本无交集</text>
<text x="168" y="175" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">unsupported_schema_version</text>
<rect x="330" y="156" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="340" y="175" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">清单畸形</text>
<text x="434" y="175" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">malformed_manifest</text>
<rect x="64" y="190" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="74" y="209" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">能力未找到</text>
<text x="168" y="209" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">capability_not_found</text>
<rect x="330" y="190" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="340" y="209" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">提供者未找到</text>
<text x="434" y="209" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">provider_not_found</text>
<rect x="64" y="224" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="74" y="243" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">策略拒绝</text>
<text x="168" y="243" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">policy_denied</text>
<rect x="330" y="224" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="340" y="243" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">参数非法</text>
<text x="434" y="243" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">invalid_input</text>
<rect x="64" y="258" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="74" y="277" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">调用失败</text>
<text x="168" y="277" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">invocation_failed</text>
<rect x="330" y="258" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="340" y="277" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">流水线结构</text>
<text x="434" y="277" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">invalid_pipeline</text>
<rect x="64" y="292" width="246" height="28" rx="6" fill="#E3EEFA"/>
<text x="74" y="311" font-size="11" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">类型边不兼容</text>
<text x="168" y="311" font-size="9.5" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">incompatible_stage_edge</text>
<text x="64" y="340" font-size="11.5" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">新增错误码前必须先查旧码；两个清单类错误不可混用。</text>
<rect x="640" y="108" width="440" height="250" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="641.5" y="108.5" width="437" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="656" y="140" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">输出纪律（实测）</text>
<text x="664" y="160" font-size="13" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">标准输出：恰好一个版本化信封</text>
<text x="664" y="184" font-size="13" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">日志与诊断：永远走标准错误</text>
<text x="664" y="208" font-size="13" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">命令行失败：退出码 1 + 一行人话错误</text>
<text x="664" y="236" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">实测失败契约（逐例冻结，全部退出码 1）：</text>
<text x="664" y="258" font-size="10" fill="#7C8FA3" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">· kg: --describe cannot be combined with</text>
<text x="664" y="276" font-size="10" fill="#7C8FA3" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">· kg: invalid --params JSON: invalid cha</text>
<text x="664" y="294" font-size="10" fill="#7C8FA3" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">· kg: --params must contain a JSON objec</text>
<text x="664" y="312" font-size="10" fill="#7C8FA3" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">· kg: provider and inventory options bel</text>
<text x="664" y="330" font-size="10" fill="#7C8FA3" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">· kg: --provider-bin expects ID=PATH</text>
<rect x="40" y="372" width="1040" height="96" rx="10" fill="#E8EEF5"/>
<text x="64" y="404" font-size="13" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">实测披露：命令行顶层的错误信封把机器码统一折叠为通用错误码，细节留在人话消息里；</text>
<text x="64" y="428" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">阶段级错误（如流水线某一步的调用失败）保留原样机器码。这是与规格文档的已登记偏差。</text>
<text x="64" y="452" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">机器码的权威消费方是结构与自动化路径（发布面结构化内容、阶段信封）。</text>
<rect x="40" y="492" width="1040" height="118" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="41.5" y="492.5" width="1037" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="56" y="524" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">未知能力实测（冻结输出）</text>
<text x="64" y="544" font-size="13" fill="#0E3A75" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">退出码 1 · 信封架构版本 kg.error/v1 · 标准输出恰好一个对象</text>
<text x="64" y="570" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">消息：</text>
<text x="112" y="570" font-size="12" fill="#1B2733" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">capability not found: no.such-capability; run kg list</text>
<text x="64" y="594" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">机器码：</text>
<text x="132" y="594" font-size="12" fill="#1B2733" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">error</text>
<rect x="900" y="512" width="31.3" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="915.7" y="526.5" font-size="10.5" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C17</text>
<rect x="937.3" y="512" width="31.3" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="953" y="526.5" font-size="10.5" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C18</text>
</g>
</svg>
