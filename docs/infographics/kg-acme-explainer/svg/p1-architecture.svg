<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img">
<title>中枢五职责与 provider 两侧</title>
<desc>发现、协议、目录、策略、路由五个职责与协议原生、遗留两侧</desc>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1120" height="620" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="0.5" y="0.5" width="1119" height="619" rx="10" fill="none" stroke="#D8E2EC" stroke-width="1"/>
<text x="40" y="44" font-size="15" fill="#1D5FBF" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">架构</text>
<text x="40" y="80" font-size="22" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">五职责内核：算法不进中枢，中枢只做集成</text>
<rect x="40" y="110" width="196" height="96" rx="10" fill="#E3EEFA"/>
<rect x="40" y="110" width="196" height="96" rx="10" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="138" y="142" font-size="16" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">发现</text>
<text x="138" y="168" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">五级顺序找 provider</text>
<text x="138" y="188" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">逐个尽力探测</text>
<rect x="248" y="110" width="196" height="96" rx="10" fill="#E3EEFA"/>
<rect x="248" y="110" width="196" height="96" rx="10" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="346" y="142" font-size="16" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">协议</text>
<text x="346" y="168" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">自描述与执行信封</text>
<text x="346" y="188" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">版本协商</text>
<rect x="456" y="110" width="196" height="96" rx="10" fill="#E3EEFA"/>
<rect x="456" y="110" width="196" height="96" rx="10" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="554" y="142" font-size="16" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">目录</text>
<text x="554" y="168" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">稳定命令面</text>
<text x="554" y="188" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">加载期强校验</text>
<rect x="664" y="110" width="196" height="96" rx="10" fill="#E3EEFA"/>
<rect x="664" y="110" width="196" height="96" rx="10" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="762" y="142" font-size="16" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">策略</text>
<text x="762" y="168" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">副作用四门</text>
<text x="762" y="188" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">默认全拒</text>
<rect x="872" y="110" width="196" height="96" rx="10" fill="#E3EEFA"/>
<rect x="872" y="110" width="196" height="96" rx="10" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="970" y="142" font-size="16" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">路由</text>
<text x="970" y="168" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">确定性三键排序</text>
<text x="970" y="188" font-size="11" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">选中即执行</text>
<rect x="40" y="234" width="500" height="252" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="41.5" y="234.5" width="497" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="56" y="266" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">协议原生侧（权威）</text>
<rect x="64" y="284" width="8" height="8" rx="2" fill="#2a78d6"/>
<text x="84" y="293" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">自描述通过协议校验后成为参数面真相源</text>
<rect x="64" y="326" width="8" height="8" rx="2" fill="#2a78d6"/>
<text x="84" y="335" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">发现顺序第五级扫描协议原生前缀可执行文件</text>
<rect x="64" y="368" width="8" height="8" rx="2" fill="#2a78d6"/>
<text x="84" y="377" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">实测三个已知原生二进制进路由表登记</text>
<rect x="64" y="410" width="8" height="8" rx="2" fill="#2a78d6"/>
<text x="84" y="419" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">依赖探测失败不降级：未知不等于不可用</text>
<rect x="580" y="234" width="500" height="252" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="581.5" y="234.5" width="497" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="596" y="266" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">遗留命令行侧（兜底兼容桥）</text>
<rect x="604" y="284" width="8" height="8" rx="2" fill="#7C8FA3"/>
<text x="624" y="293" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">只桥接有真实命令行调用形态的三个遗留工程</text>
<rect x="604" y="324" width="8" height="8" rx="2" fill="#7C8FA3"/>
<text x="624" y="333" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">桥表按键挂接在 provider 发布命名空间下</text>
<rect x="604" y="364" width="8" height="8" rx="2" fill="#7C8FA3"/>
<text x="624" y="373" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">探测成功时自描述覆盖桥表，不一致即发射诊断</text>
<rect x="604" y="404" width="8" height="8" rx="2" fill="#7C8FA3"/>
<text x="624" y="413" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">无命令行形态的能力是纯协议能力：</text>
<rect x="604" y="444" width="8" height="8" rx="2" fill="#7C8FA3"/>
<text x="624" y="453" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">未探测即报能力未找到</text>
<rect x="40" y="510" width="1040" height="76" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="41.5" y="510.5" width="1037" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="56" y="542" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">路由三键排序（确定性）</text>
<text x="64" y="556" font-size="13" fill="#0E3A75" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">探测过的优先于兜底的</text>
<polygon points="268,552 287,556.2 287,547.8" fill="#1D5FBF"/>
<polygon points="296,552 287,554.6 287,549.4" fill="#1D5FBF"/>
<text x="310" y="556" font-size="13" fill="#0E3A75" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">然后按权重降序</text>
<polygon points="452,552 471,556.2 471,547.8" fill="#1D5FBF"/>
<polygon points="480,552 471,554.6 471,549.4" fill="#1D5FBF"/>
<text x="494" y="556" font-size="13" fill="#0E3A75" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">平手按提供者标识字典序</text>
<text x="760" y="556" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">· 同输入必得同选择</text>
<rect x="980" y="528" width="31.3" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="995.7" y="542.5" font-size="10.5" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C02</text>
<rect x="1017.3" y="528" width="31.3" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="1033" y="542.5" font-size="10.5" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C03</text>
<rect x="1054.7" y="528" width="31.3" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="1070.3" y="542.5" font-size="10.5" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C12</text>
</g>
</svg>
