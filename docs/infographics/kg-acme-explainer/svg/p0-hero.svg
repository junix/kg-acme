<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img">
<title>kg-acme 总览：三条入口、一份快照、两条铁律</title>
<desc>能力中枢模式总览：中枢只做集成，算法在 provider 生态</desc>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1120" height="640" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="0.5" y="0.5" width="1119" height="639" rx="10" fill="none" stroke="#D8E2EC" stroke-width="1"/>
<text x="40" y="50" font-size="15" fill="#1D5FBF" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">知识图谱能力中枢</text>
<text x="40" y="90" font-size="25" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">一个中枢，把散落的图谱工具组织成一张可发现、可路由、可治理的能力表</text>
<rect x="40" y="110" width="500" height="106" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="41.5" y="110.5" width="497" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="56" y="142" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">铁律一 · 中枢只做集成</text>
<text x="60" y="158" font-size="13" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">发现 · 协议 · 目录 · 策略 · 路由，恰好五件事</text>
<text x="60" y="182" font-size="13" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">抽取、去重、社区、问答、存储等图谱算法</text>
<text x="60" y="206" font-size="13" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">全部属于 provider 工程，中枢绝不自实现</text>
<rect x="580" y="110" width="500" height="106" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="581.5" y="110.5" width="497" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="596" y="142" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">铁律二 · 参数面不写死</text>
<text x="600" y="158" font-size="13" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">能力的旗标、枚举、默认值来自 provider 自描述</text>
<text x="600" y="182" font-size="13" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">中枢内置的兼容表只是兜底，</text>
<text x="600" y="206" font-size="13" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">与自描述冲突时以 provider 为准并发射诊断</text>
<text x="40" y="258" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">三条入口 · 一份不可变快照 · 一片生态</text>
<rect x="40" y="274" width="220" height="82" rx="10" fill="#E3EEFA"/>
<rect x="40" y="274" width="220" height="82" rx="10" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="150" y="304" font-size="17" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">kg</text>
<text x="150" y="328" font-size="12" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">执行面 · 能力调用与流水线</text>
<rect x="290" y="274" width="220" height="82" rx="10" fill="#E3EEFA"/>
<rect x="290" y="274" width="220" height="82" rx="10" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="400" y="304" font-size="17" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">kgctl</text>
<text x="400" y="328" font-size="12" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">管理面 · 刷新快照与诊断</text>
<rect x="540" y="274" width="220" height="82" rx="10" fill="#E3EEFA"/>
<rect x="540" y="274" width="220" height="82" rx="10" fill="none" stroke="#2a78d6" stroke-width="1"/>
<text x="650" y="304" font-size="17" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">kg-mcp</text>
<text x="650" y="328" font-size="12" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">发布面 · 工具清单与调用</text>
<polygon points="766,315 793,319.2 793,310.8" fill="#1D5FBF"/>
<polygon points="802,315 793,317.6 793,312.4" fill="#1D5FBF"/>
<rect x="812" y="274" width="268" height="82" rx="10" fill="#FFFFFF" stroke="#1D5FBF" stroke-width="1.6"/>
<text x="946" y="304" font-size="15" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">不可变能力快照</text>
<text x="946" y="328" font-size="12" fill="#46586B" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">管理面刷新生成 · 带内容指纹</text>
<rect x="40" y="374" width="1040" height="52" rx="10" fill="#E8EEF5"/>
<text x="560" y="406" font-size="13" fill="#1B2733" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">快照之下是 provider 生态：协议原生 provider 与遗留命令行（兼容桥接入）——算法都在那里</text>
<rect x="40" y="446" width="241" height="88" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<text x="56" y="488" font-size="30" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">17</text>
<text x="56" y="514" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">条稳定命令（目录内置）</text>
<rect x="301" y="446" width="241" height="88" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<text x="317" y="488" font-size="30" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">11</text>
<text x="317" y="514" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">个发布命名空间</text>
<rect x="562" y="446" width="241" height="88" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<text x="578" y="488" font-size="30" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">5</text>
<text x="578" y="514" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">项能力（实测快照）</text>
<rect x="823" y="446" width="241" height="88" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<text x="839" y="488" font-size="30" fill="#0E3A75" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">50</text>
<text x="839" y="514" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">个 git 跟踪文件</text>
<text x="40" y="574" font-size="14" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">页面纪律</text>
<text x="130" y="574" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">显示层零代码细节：源文件名、代码坐标、逐字摘录、内部标识符、内部路径与重建命令一律不出现；</text>
<text x="130" y="600" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">每个数字都锚定冻结证据，坐标级锚点登记在交付目录验证层。</text>
<rect x="960" y="566" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="976.1" y="581" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C01</text>
<rect x="998.1" y="566" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="1014.2" y="581" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C02</text>
<rect x="1036.3" y="566" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="1052.4" y="581" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C03</text>
<rect x="1074.5" y="566" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="1090.5" y="581" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C04</text>
</g>
</svg>
