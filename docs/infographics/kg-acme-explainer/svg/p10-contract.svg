<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img">
<title>实测契约案例：五个冻结证据</title>
<desc>零启动、三调用复核、门拒绝、协商两分、断点重跑零调用</desc>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1120" height="700" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="0.5" y="0.5" width="1119" height="699" rx="10" fill="none" stroke="#D8E2EC" stroke-width="1"/>
<text x="40" y="44" font-size="15" fill="#1D5FBF" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">契约实测</text>
<text x="40" y="80" font-size="22" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">每个案例都是真二进制 + 假提供者的一次完整运行</text>
<rect x="40" y="112" width="1040" height="78" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="40" y="112" width="6" height="78" rx="2" fill="#2a78d6"/>
<text x="66" y="140" font-size="14" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">案例一 · 只读面零启动</text>
<text x="66" y="166" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">10 类只读操作连跑一遍，假提供者日志增量 0 行——帮助、列表、描述、补全、干跑、工具清单全部只读快照。</text>
<rect x="858" y="126" width="119.4" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="917.7" y="140.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">provider 启动 0 次</text>
<rect x="40" y="204" width="1040" height="78" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="40" y="204" width="6" height="78" rx="2" fill="#2a78d6"/>
<text x="66" y="232" font-size="14" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">案例二 · 执行面三调用</text>
<text x="66" y="258" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">真实调用副作用能力：先参数与策略校验，再对最终选中者复核并调用；日志恰好三行，顺序固定。</text>
<rect x="858" y="218" width="185.5" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="950.7" y="232.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">describe → available → invoke</text>
<rect x="40" y="296" width="1040" height="78" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="40" y="296" width="6" height="78" rx="2" fill="#e34948"/>
<text x="66" y="324" font-size="14" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">案例三 · 门拒绝零启动</text>
<text x="66" y="350" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">不开门调用副作用能力：错误信封点名被拒副作用与所需旗标，退出码 1；日志增量为零——provider 根本没启动。</text>
<rect x="858" y="310" width="125.1" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="920.5" y="324.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">文案冻结在策略门一节</text>
<rect x="40" y="388" width="1040" height="78" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="40" y="388" width="6" height="78" rx="2" fill="#2a78d6"/>
<text x="66" y="416" font-size="14" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">案例四 · 协商两分</text>
<text x="66" y="442" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">未来版本与坏输出两个假提供者分别落入版本无交集与清单畸形；未知副作用在枚举封闭层即拒收。</text>
<rect x="858" y="402" width="93" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="904.5" y="416.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">错误码各归各类</text>
<rect x="40" y="480" width="1040" height="78" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="40" y="480" width="6" height="78" rx="2" fill="#2a78d6"/>
<text x="66" y="508" font-size="14" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">案例五 · 断点重跑零调用</text>
<text x="66" y="534" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">校验和一致的阶段全部复用：重跑日志里调用次数为零，只有一次复核；产物通道注入的是工作目录副本。</text>
<rect x="858" y="494" width="144.9" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="930.5" y="508.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">调用 0 次 · 复用 2 阶段</text>
<rect x="40" y="584" width="1040" height="84" rx="10" fill="#E8EEF5"/>
<text x="64" y="616" font-size="13" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">假提供者纪律：全部证据来自 shell 假提供者——零真实网络、零模型下载、零真实调用外部接口。</text>
<text x="64" y="644" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">模型类路径只以假实现出现；每个数字都能在冻结证据里逐字节找到。</text>
<rect x="920" y="596" width="31.3" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="935.7" y="610.5" font-size="10.5" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C28</text>
</g>
</svg>
