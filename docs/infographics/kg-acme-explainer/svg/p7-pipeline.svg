<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img">
<title>流水线：纯编排、类型边与断点重跑</title>
<desc>每步一次完整路由调用；类型边三层校验；工作目录自包含；复用校验和</desc>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="1120" height="700" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="0.5" y="0.5" width="1119" height="699" rx="10" fill="none" stroke="#D8E2EC" stroke-width="1"/>
<text x="40" y="44" font-size="15" fill="#1D5FBF" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="600">流水线</text>
<text x="40" y="80" font-size="22" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">中枢仍然只做编排：每一步都是一次完整路由调用</text>
<rect x="40" y="108" width="560" height="250" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="41.5" y="108.5" width="557" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="56" y="140" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">实测计划：写产物 → 注入下游（拓扑序冻结）</text>
<rect x="64" y="158" width="200" height="44" rx="8" fill="#E3EEFA"/>
<text x="164" y="185" font-size="12.5" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">test.artifact</text>
<polygon points="272,180 303,184.2 303,175.8" fill="#1D5FBF"/>
<polygon points="312,180 303,182.6 303,177.4" fill="#1D5FBF"/>
<text x="320" y="178" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">产物注入下游参数（占位符换工作目录副本）</text>
<text x="320" y="196" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">注入值</text>
<text x="364.7" y="196" font-size="11" fill="#7C8FA3" text-anchor="start" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace">wd/stage-write-provider-out.json</text>
<rect x="64" y="214" width="200" height="44" rx="8" fill="#E3EEFA"/>
<text x="164" y="241" font-size="12.5" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="700">test.echo</text>
<text x="64" y="302" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">阶段产物先校验校验和，再复制进工作目录并重算哈希；</text>
<text x="64" y="324" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">下游拿到的是工作目录里的自包含副本。</text>
<rect x="640" y="108" width="440" height="250" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="641.5" y="108.5" width="437" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="656" y="140" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">类型边三层校验（计划期，拒绝即不执行）</text>
<rect x="664" y="152" width="8" height="8" rx="2" fill="#2a78d6"/>
<text x="684" y="161" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">可接线：上游必须是产物文件型能力（内联结果型没有产物可传）</text>
<rect x="664" y="214" width="8" height="8" rx="2" fill="#2a78d6"/>
<text x="684" y="223" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">种类一致：边声明的产物种类必须等于上游声明</text>
<rect x="664" y="276" width="8" height="8" rx="2" fill="#2a78d6"/>
<text x="684" y="285" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">通道兼容：产物种类与下游参数按约定映射通道，两侧已知且不同即拒</text>
<text x="664" y="336" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">实测违规边：内联结果型能力被接线 → 计划期直接拒绝。</text>
<rect x="40" y="384" width="500" height="268" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="41.5" y="384.5" width="497" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="56" y="416" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">门预检与断点重跑（实测）</text>
<text x="64" y="436" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">预检：计划期收集全部阶段副作用并集，一次过门；</text>
<text x="64" y="458" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">缺旗标则快速失败——任何 provider 都不会启动。</text>
<text x="64" y="484" font-size="13" fill="#0E3A75" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">实测整链运行：4 次调用（复核 2 次 + 调用 2 次）</text>
<rect x="64" y="498" width="108.7" height="23" rx="9" fill="#E3EEFA"/>
<text x="118.4" y="513" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">describe --json</text>
<rect x="294" y="498" width="114.8" height="23" rx="9" fill="#E3EEFA"/>
<text x="351.4" y="513" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">available --json</text>
<rect x="64" y="532" width="211.6" height="23" rx="9" fill="#E3EEFA"/>
<text x="169.8" y="547" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">invoke test.artifact --request -</text>
<rect x="294" y="532" width="187.4" height="23" rx="9" fill="#E3EEFA"/>
<text x="387.7" y="547" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">invoke test.echo --request -</text>
<text x="64" y="588" font-size="12.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">断点重跑实测：校验和一致 → 两阶段全部复用，调用 0 次，仅复核 2 次</text>
<text x="64" y="612" font-size="12" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">校验和不符则该步重跑，下游随之用新产物。</text>
<rect x="580" y="384" width="500" height="268" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="581.5" y="384.5" width="497" height="3.5" rx="1.5" fill="#1D5FBF"/>
<text x="596" y="416" font-size="16" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">工作目录（实测落盘清单）</text>
<rect x="604" y="424" width="151.1" height="23" rx="9" fill="#E3EEFA"/>
<text x="679.5" y="439" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">pipeline.envelope.json</text>
<rect x="844" y="424" width="169.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="928.6" y="439" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">stage-shout.envelope.json</text>
<rect x="604" y="464" width="193.5" height="23" rx="9" fill="#E3EEFA"/>
<text x="700.7" y="479" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">stage-write-provider-out.json</text>
<rect x="844" y="464" width="169.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="928.6" y="479" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">stage-write.envelope.json</text>
<text x="604" y="546" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">每阶段一个阶段信封 + 整链一个总信封，全部落工作目录。</text>
<text x="604" y="572" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">重跑按阶段标识匹配记录；</text>
<text x="604" y="598" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">成环或引用未知阶段 → 流水线结构错误；平手按定义序。</text>
<rect x="830" y="404" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="846.1" y="419" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C19</text>
<rect x="868.1" y="404" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="884.2" y="419" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C20</text>
<rect x="906.3" y="404" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="922.4" y="419" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C21</text>
<rect x="944.4" y="404" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="960.5" y="419" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C22</text>
<rect x="982.6" y="404" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="998.7" y="419" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C23</text>
<rect x="1020.7" y="404" width="32.2" height="23" rx="9" fill="#E3EEFA"/>
<text x="1036.8" y="419" font-size="11" fill="#1D5FBF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">C24</text>
</g>
</svg>
