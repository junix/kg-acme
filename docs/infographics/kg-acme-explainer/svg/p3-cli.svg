<text x="64" y="548" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">命令面是长期契约：provider 可以来去，命令表不动；新能力经 provider 侧发布即可见于列表。</text>
<text x="64" y="574" font-size="12" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">目录加载期强校验：标识镜像、分段小写连字符、标题无结尾标点、描述单句收句号——非法即拒绝启动。</text>
