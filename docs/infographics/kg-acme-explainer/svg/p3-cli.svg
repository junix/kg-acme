<rect x="60" y="148" width="60.2" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="90.1" y="162.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">--params</text>
