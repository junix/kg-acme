<text x="40" y="80" font-size="22" fill="#1B2733" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-weight="700">三个入口各管一段，目录是唯一稳定契约</text>
<rect x="40" y="108" width="344" height="268" rx="10" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="1"/>
<rect x="41.5" y="108.5" width="341" height="3.5" rx="1.5" fill="#1D5FBF"/>
