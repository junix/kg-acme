<text x="467.2" y="231" font-size="11" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">completion</text>
<text x="428" y="252" font-size="11.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">刷新产出快照；提供者诊断列出每个 provider；</text>
<text x="428" y="272" font-size="11.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">能力检索列目录；路由面解释/固定/清除；补全两 shell。</text>
<text x="428" y="308" font-size="11" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">同一 CLI 语义，管理面独占盘点与发现旗标。</text>
