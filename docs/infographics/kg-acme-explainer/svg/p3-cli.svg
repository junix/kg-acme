<text x="283.9" y="194.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">--allow-data-egress</text>
<rect x="60" y="212" width="141.1" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="130.5" y="226.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">--allow-model-download</text>
<rect x="222" y="212" width="106.4" height="22.5" rx="9" fill="#E3EEFA"/>
