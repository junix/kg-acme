<rect x="60" y="244" width="48.6" height="22.5" rx="9" fill="#E3EEFA"/>
<text x="84.3" y="258.5" font-size="10.5" fill="#0E3A75" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'PingFang SC',monospace" font-weight="600">--json</text>
<text x="60" y="296" font-size="11.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">参数一次成对象传入；四把布尔门 + 干跑；</text>
<text x="60" y="318" font-size="11.5" fill="#46586B" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">标准输出恰好一个版本化信封。</text>
<text x="60" y="352" font-size="11" fill="#7C8FA3" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">盘点类选项属于管理面：执行面拒绝越权（实测退出码 1）。</text>
